<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIF PGL 2026-2027</title>
<meta name="theme-color" content="#12232B">

<style>
:root{
  --encre:#12232B; --encre-clair:#2B4451; --ardoise:#6C838E;
  --papier:#ECEFEF; --carte:#FFFFFF; --trait:#D8E0E0;
  --vert:#0F7B62; --vert-pale:#E3F1EC;
  --brique:#C8462A; --brique-pale:#FBE7E1;
  --ambre:#D99411; --ambre-pale:#FBF0D9;
  --r:14px;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--papier);color:var(--encre);
  -webkit-text-size-adjust:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

header{background:var(--encre);color:#fff;padding:16px 20px 20px;
  padding-top:calc(16px + env(safe-area-inset-top))}
.haut{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.projet{font-size:12px;letter-spacing:.14em;color:#8FA9B4;margin:0}
.moi{font-size:12px;color:#CFDDE3;background:#22384380;border:1px solid #3A5866;
  padding:5px 11px;border-radius:999px}
.total{font-family:var(--serif);font-size:44px;line-height:1;letter-spacing:-.02em}
.total-sous{font-size:13px;color:#9DB6C0;margin-top:7px}
.jauge{display:flex;gap:3px;height:30px;margin-top:18px;align-items:flex-end}
.jauge div{flex:1;background:#2B4451;border-radius:2px 2px 0 0;min-height:3px;transition:height .4s}
.jauge div.actif{background:#4FD1A5}
.jauge-legende{display:flex;gap:3px;font-size:9px;color:#7B96A2;margin-top:6px}
.jauge-legende span{flex:1;text-align:center}

main{padding:14px 14px 20px;max-width:720px;margin:0 auto}
.filtres{display:flex;gap:7px;margin-bottom:10px}
.filtres button{padding:8px 15px;border:1px solid var(--trait);border-radius:999px;
  background:var(--carte);font-size:13px;color:var(--ardoise)}
.filtres button[aria-pressed="true"]{background:var(--encre);border-color:var(--encre);color:#fff;font-weight:600}
.recherche{width:100%;padding:11px 14px;border:1px solid var(--trait);
  border-radius:999px;background:var(--carte);margin-bottom:12px}
.recherche:focus{outline:2px solid var(--vert);outline-offset:1px}

.action{background:var(--carte);border-radius:var(--r);padding:14px;margin-bottom:10px;
  border:1px solid var(--trait);display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.action.mienne{border-left:3px solid var(--vert)}
.action:active{background:#FAFBFB}
.action .quand{font-size:12px;color:var(--ardoise);grid-column:1}
.action .quoi{font-weight:650;font-size:15px;grid-column:1;line-height:1.3}
.action .somme{font-family:var(--serif);font-size:22px;grid-column:2;grid-row:1/3;
  align-self:center;text-align:right;white-space:nowrap}
.action .qui{grid-column:1/3;font-size:12px;color:var(--ardoise);margin-top:6px;line-height:1.5}
.etiquettes{grid-column:1/3;display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:#EFF2F2;color:var(--encre-clair)}
.tag.groupe{background:var(--ambre-pale);color:#8A5D00}
.tag.attente{background:var(--brique-pale);color:var(--brique);font-weight:600}
.tag.encaisse{background:var(--vert-pale);color:var(--vert)}

.ajouter{position:fixed;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));
  max-width:692px;margin:0 auto;padding:16px;border-radius:14px;background:var(--encre);
  color:#fff;font-size:16px;font-weight:650;box-shadow:0 8px 22px rgba(18,35,43,.3);z-index:41}

.voile{position:fixed;inset:0;background:rgba(18,35,43,.45);z-index:50;display:none}
.voile.ouvert{display:block}
.feuille{position:fixed;left:0;right:0;bottom:0;top:24px;background:var(--papier);
  border-radius:18px 18px 0 0;z-index:51;transform:translateY(100%);
  transition:transform .28s ease;display:flex;flex-direction:column}
.feuille.ouverte{transform:translateY(0)}
.feuille-haut{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border-bottom:1px solid var(--trait);background:var(--carte);border-radius:18px 18px 0 0}
.feuille-haut strong{font-size:16px}
.feuille-haut button{font-size:15px;color:var(--vert);font-weight:650;padding:6px}
.feuille-haut button.annuler{color:var(--ardoise);font-weight:400}
.feuille-corps{overflow-y:auto;padding:16px 16px 40px;-webkit-overflow-scrolling:touch}
label{display:block;font-size:12px;color:var(--ardoise);margin:0 0 5px}
.champ{margin-bottom:14px}
.champ input,.champ select,.champ textarea{width:100%;padding:11px 12px;
  border:1px solid var(--trait);border-radius:10px;background:var(--carte)}
.champ input:focus,.champ select:focus,.champ textarea:focus{outline:2px solid var(--vert);outline-offset:1px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bascule{display:flex;gap:8px}
.bascule button{flex:1;padding:11px;border:1px solid var(--trait);border-radius:10px;
  background:var(--carte);font-size:14px}
.bascule button[aria-pressed="true"]{background:var(--encre);color:#fff;border-color:var(--encre)}
.bascule.groupe button[aria-pressed="true"]{background:var(--ambre);border-color:var(--ambre);color:#3B2A00}
.noms{display:flex;flex-wrap:wrap;gap:7px}
.noms button{padding:8px 13px;border:1px solid var(--trait);border-radius:999px;
  background:var(--carte);font-size:14px}
.noms button[aria-pressed="true"]{background:var(--vert);border-color:var(--vert);color:#fff}
.noms.gele{opacity:.45;pointer-events:none}
.apercu{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);
  padding:13px;margin:16px 0;display:flex;justify-content:space-around;text-align:center}
.apercu div{font-size:12px;color:var(--ardoise)}
.apercu strong{display:block;font-family:var(--serif);font-size:21px;color:var(--encre);margin-bottom:3px}
.alerte{background:var(--brique-pale);color:var(--brique);border-radius:10px;
  padding:10px 12px;font-size:13px;margin-bottom:14px;display:none}
.alerte.visible{display:block}
.supprimer{width:100%;padding:13px;border-radius:10px;background:var(--brique-pale);
  color:var(--brique);font-weight:600;margin-top:8px}

.vide{text-align:center;padding:44px 20px;color:var(--ardoise)}
.vide p{margin:0 0 4px;font-size:15px;color:var(--encre);font-weight:600}
.vide span{font-size:13px}
.avis{background:var(--ambre-pale);color:#7A5200;font-size:12px;padding:9px 14px;
  text-align:center;display:none}
.avis.visible{display:block}

/* choix du prénom au premier lancement */
.accueil{position:fixed;inset:0;background:var(--encre);color:#fff;z-index:60;
  display:none;flex-direction:column;justify-content:center;padding:28px;overflow-y:auto}
.accueil.ouvert{display:flex}
.accueil h1{font-family:var(--serif);font-size:30px;font-weight:400;margin:0 0 6px}
.accueil p{color:#9DB6C0;font-size:14px;margin:0 0 22px}
.accueil .noms button{background:#22384D;border-color:#3A5866;color:#fff}
.accueil .noms button:active{background:var(--vert);border-color:var(--vert)}

@media (min-width:640px){.total{font-size:54px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="accueil" id="accueil">
  <h1>Qui es-tu ?</h1>
  <p>Pour retrouver tes actions et te cocher automatiquement quand tu en enregistres une.</p>
  <div class="noms" id="accueil-noms"></div>
</div>

<div class="avis" id="avis"></div>

<header>
  <div class="haut">
    <p class="projet">PIF PGL 2026-2027</p>
    <button class="moi" id="btn-moi"></button>
  </div>
  <div class="total" id="entete-total">0 €</div>
  <div class="total-sous" id="entete-sous">Aucune action enregistrée</div>
  <div class="jauge" id="jauge"></div>
  <div class="jauge-legende" id="jauge-legende"></div>
</header>

<main>
  <div class="filtres">
    <button data-filtre="toutes" aria-pressed="true">Toutes les actions</button>
    <button data-filtre="miennes" aria-pressed="false">Les miennes</button>
  </div>
  <input class="recherche" id="recherche" type="search" placeholder="Chercher une action, un lieu, un prénom">
  <div id="liste-actions"></div>
</main>

<button class="ajouter" id="bouton-ajouter">Enregistrer une action</button>

<div class="voile" id="voile"></div>
<div class="feuille" id="feuille" role="dialog" aria-modal="true" aria-label="Fiche action">
  <div class="feuille-haut">
    <button class="annuler" id="btn-annuler">Annuler</button>
    <strong id="feuille-titre">Nouvelle action</strong>
    <button id="btn-enregistrer">Enregistrer</button>
  </div>
  <div class="feuille-corps">
    <div class="duo">
      <div class="champ"><label for="f-date">Date</label><input type="date" id="f-date"></div>
      <div class="champ"><label for="f-montant">Montant (€)</label><input type="number" id="f-montant" inputmode="decimal" step="0.01" min="0" placeholder="0"></div>
    </div>
    <div class="champ"><label for="f-nom">Nom de l'action</label><input id="f-nom" placeholder="Vente de gâteaux au marché"></div>
    <div class="duo">
      <div class="champ"><label for="f-duree">Durée (h)</label><input type="number" id="f-duree" inputmode="decimal" step="0.5" min="0" placeholder="0"></div>
      <div class="champ"><label for="f-nb">Nb de participants</label><input type="number" id="f-nb" inputmode="numeric" min="0" placeholder="0"></div>
    </div>
    <div class="champ">
      <label>Projet de groupe</label>
      <div class="bascule groupe" id="f-groupe">
        <button type="button" data-val="oui" aria-pressed="false">Oui, toute l'équipe</button>
        <button type="button" data-val="non" aria-pressed="true">Non</button>
      </div>
    </div>
    <div class="champ">
      <label id="label-noms">Qui a participé</label>
      <div class="noms" id="f-noms" aria-labelledby="label-noms"></div>
    </div>
    <div class="alerte" id="f-alerte"></div>
    <div class="apercu">
      <div><strong id="ap-personne">—</strong>par personne</div>
      <div><strong id="ap-heure">—</strong>par heure</div>
    </div>
    <div class="champ">
      <label>Argent encaissé</label>
      <div class="bascule" id="f-encaisse">
        <button type="button" data-val="oui" aria-pressed="true">Oui</button>
        <button type="button" data-val="non" aria-pressed="false">Pas encore</button>
      </div>
    </div>
    <div class="duo">
      <div class="champ"><label for="f-paiement">Paiement</label>
        <select id="f-paiement"><option value=""></option><option>Espèces</option><option>Virement</option><option>Chèque</option><option>En ligne</option><option>Autre</option></select>
      </div>
      <div class="champ"><label for="f-garde">Argent gardé par</label><select id="f-garde"></select></div>
    </div>
    <div class="champ"><label for="f-client">Client / Contact</label><input id="f-client" placeholder="Famille Cohen, Super U…"></div>
    <div class="duo">
      <div class="champ"><label for="f-tel">Tél. / Mail</label><input id="f-tel" inputmode="tel"></div>
      <div class="champ"><label for="f-lieu">Lieu</label><input id="f-lieu"></div>
    </div>
    <div class="champ"><label for="f-notes">Notes</label><textarea id="f-notes" rows="3"></textarea></div>
    <button class="supprimer" id="btn-supprimer" style="display:none">Supprimer cette action</button>
  </div>
</div>

<script>
/* ================================================================
   SITE DES PARTICIPANTS
   Ils voient : le total récolté, le suivi mois par mois, et toutes
   les actions de l'équipe. Ils ne voient pas le bilan par personne
   ni le tableau de bord détaillé — ça, c'est le site de coordination.
   ----------------------------------------------------------------
   BASE DE DONNÉES COMMUNE (Firebase Firestore)
   Remplis PROJET et CLE_API ci-dessous avec les deux valeurs de ta
   console Firebase. Les MÊMES valeurs doivent être mises dans le
   fichier de coordination, sinon les deux sites ne parlent pas à la
   même base.
   Chaque action enregistrée part aussitôt chez tout le monde, et la
   liste se met à jour au retour sur l'app et toutes les 45 s.
   Format d'une action :
     { id, date:"2026-09-12", nom, client, contact, lieu,
       montant:240, duree:4, groupe:false, nbParticipants:3,
       participants:["Anouk","Lola","Gab"], encaisse:true,
       paiement:"Espèces", gardePar:"Anouk", notes:"" }
   Tant que PROJET est vide, chaque téléphone ne voit que ses propres
   actions : il n'y a pas de base pour les partager.
================================================================ */
/* ▼▼▼ LES DEUX SEULES LIGNES À REMPLIR ▼▼▼ */
const PROJET  = "pif-pgl-2026";
const CLE_API = "AIzaSyCGQr9E811rageLZbi97TfBARGsmZS0Ask";
/* ▲▲▲ ▲▲▲ */
const PREMIER_MOIS = "2026-09";  // la collecte va de ce mois-là à juin
const NB_MOIS = 10;
const RAFRAICHIR_MS = 45000;

let MEMBRES = ["Anouk","Lola","Samuel","Ben","Jade","Mia","Salomé","Solal","Gab","Gabi",
               "Tamar","Gary","Ilan","Noam","Neal","Sacha","Ron","Zach","Elinora","Léana"];

const CLE = "pifpgl-actions", CLE_MOI = "pifpgl-moi";
let memoire = [], stockageOK = true, MOI = null;
try{ localStorage.setItem("__t__","1"); localStorage.removeItem("__t__"); }catch(e){ stockageOK = false; }

const EN_LIGNE = !!(PROJET && CLE_API);
const FS = "https://firestore.googleapis.com/v1/projects/" + PROJET +
           "/databases/(default)/documents/actions";
const cle = (s) => (s.includes("?") ? "&" : "?") + "key=" + CLE_API;
const nouvelId = () => Date.now() + "-" + Math.random().toString(36).slice(2,7);

async function fs(url, options){
  const r = await fetch(url, options);
  if(!r.ok){
    let d = ""; try{ d = (await r.json()).error.message; }catch(e){}
    throw new Error("Base de données : " + (d || r.status));
  }
  return r.status === 200 ? await r.json() : {};
}

const Base = {
  async lire(){
    if(EN_LIGNE){
      const tout = []; let jeton = "";
      do{
        const u0 = FS + "?pageSize=300" + (jeton ? "&pageToken=" + jeton : "");
        const u = u0 + cle(u0);
        const d = await fs(u);
        for(const doc of (d.documents || [])){
          try{
            const a = JSON.parse(doc.fields.json.stringValue);
            a.id = doc.name.split("/").pop();
            tout.push(a);
          }catch(e){}
        }
        jeton = d.nextPageToken || "";
      } while(jeton);
      return tout;
    }
    if(!stockageOK) return memoire;
    try{ return JSON.parse(localStorage.getItem(CLE) || "[]"); }catch(e){ return []; }
  },
  async ajouter(a){
    a.id = a.id || nouvelId();
    if(EN_LIGNE){
      const u = FS + "?documentId=" + encodeURIComponent(a.id);
      await fs(u + cle(u),
        {method:"POST", headers:{"Content-Type":"application/json"},
         body: JSON.stringify({fields:{json:{stringValue: JSON.stringify(a)}}})});
      return a;
    }
    const t = await Base.lire(); t.push(a); await Base.ecrire(t); return a;
  },
  async modifier(a){
    if(EN_LIGNE){
      const u = FS + "/" + encodeURIComponent(a.id);
      await fs(u + cle(u),
        {method:"PATCH", headers:{"Content-Type":"application/json"},
         body: JSON.stringify({fields:{json:{stringValue: JSON.stringify(a)}}})});
      return a;
    }
    const t = await Base.lire();
    const i = t.findIndex(x => x.id === a.id);
    if(i > -1) t[i] = a;
    await Base.ecrire(t); return a;
  },
  async supprimer(id){
    if(EN_LIGNE){
      const u = FS + "/" + encodeURIComponent(id);
      await fs(u + cle(u), {method:"DELETE"});
      return;
    }
    await Base.ecrire((await Base.lire()).filter(x => x.id !== id));
  },
  async ecrire(t){
    memoire = t;
    if(!EN_LIGNE && stockageOK) localStorage.setItem(CLE, JSON.stringify(t));
  }
};

const nb = n => Number(n) || 0;
const parPersonne = a => {
  const d = a.groupe ? MEMBRES.length : nb(a.nbParticipants);
  return d > 0 ? nb(a.montant) / d : 0;
};
const parHeure = a => nb(a.duree) > 0 ? nb(a.montant) / nb(a.duree) : null;
const aParticipe = (a, nom) => !!nom && (a.groupe || (a.participants || []).includes(nom));

function moisCollecte(){
  const [an, mo] = PREMIER_MOIS.split("-").map(Number);
  return Array.from({length:NB_MOIS}, (_, i) => {
    const d = new Date(an, mo - 1 + i, 1);
    return {cle: d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"),
            libelle: d.toLocaleDateString("fr-FR",{month:"short"}).replace(".","")};
  });
}

const euro = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",
  maximumFractionDigits: Math.abs(n) >= 100 || n % 1 === 0 ? 0 : 2}).format(n || 0);
const euro2 = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",
  minimumFractionDigits:2, maximumFractionDigits:2}).format(n || 0);
const jour = d => d ? new Date(d + "T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"}) : "Sans date";
const echappe = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let ACTIONS = [], enCours = null, filtre = "toutes";

function toutAfficher(){ afficherEntete(); afficherActions(); }

function afficherEntete(){
  const total = ACTIONS.reduce((s,a) => s + nb(a.montant), 0);
  const n = ACTIONS.length;
  document.getElementById("entete-total").textContent = euro(total);
  document.getElementById("entete-sous").textContent =
    n === 0 ? "Aucune action enregistrée"
            : n + (n > 1 ? " actions" : " action") + " depuis le début de l'année";
  const mois = moisCollecte();
  const vals = mois.map(m => ACTIONS.filter(a => (a.date||"").slice(0,7) === m.cle)
                                    .reduce((s,a) => s + nb(a.montant), 0));
  const max = Math.max(...vals, 1);
  document.getElementById("jauge").innerHTML = vals.map((v,i) =>
    `<div class="${v>0?"actif":""}" style="height:${Math.max(3, v/max*30)}px" title="${mois[i].libelle} : ${euro(v)}"></div>`).join("");
  document.getElementById("jauge-legende").innerHTML =
    mois.map(m => `<span>${m.libelle}</span>`).join("");
}

function afficherActions(){
  const q = document.getElementById("recherche").value.trim().toLowerCase();
  const liste = ACTIONS
    .filter(a => filtre === "toutes" || aParticipe(a, MOI))
    .filter(a => !q || [a.nom,a.lieu,a.client,a.notes,(a.participants||[]).join(" ")]
                        .join(" ").toLowerCase().includes(q))
    .sort((a,b) => (b.date || "").localeCompare(a.date || ""));
  const cible = document.getElementById("liste-actions");

  if(!liste.length){
    let mot;
    if(q) mot = `<p>Rien ne correspond</p><span>Essaie un autre mot.</span>`;
    else if(filtre === "miennes") mot = `<p>Tu n'apparais dans aucune action</p><span>Pense à te cocher quand tu en enregistres une.</span>`;
    else mot = `<p>Première action à enregistrer</p><span>Appuie sur le bouton en bas dès qu'une action est terminée.</span>`;
    cible.innerHTML = `<div class="vide">${mot}</div>`;
    return;
  }
  cible.innerHTML = liste.map(a => {
    const qui = a.groupe ? "Toute l'équipe" : (a.participants || []).join(", ") || "Aucun prénom sélectionné";
    return `<div class="action ${aParticipe(a, MOI) ? "mienne" : ""}" data-id="${a.id}" role="button" tabindex="0">
      <div class="quand">${jour(a.date)}${a.lieu ? " · " + echappe(a.lieu) : ""}</div>
      <div class="quoi">${echappe(a.nom) || "Sans nom"}</div>
      <div class="somme">${euro(nb(a.montant))}</div>
      <div class="qui">${echappe(qui)} · ${euro2(parPersonne(a))} chacun${nb(a.duree) ? " · " + nb(a.duree) + " h" : ""}</div>
      <div class="etiquettes">
        ${a.groupe ? '<span class="tag groupe">Projet de groupe</span>' : ""}
        ${a.encaisse === false ? '<span class="tag attente">À encaisser</span>' : '<span class="tag encaisse">Encaissé</span>'}
        ${a.paiement ? `<span class="tag">${echappe(a.paiement)}</span>` : ""}
        ${a.gardePar ? `<span class="tag">Chez ${echappe(a.gardePar)}</span>` : ""}
      </div>
    </div>`;
  }).join("");
}

/* ---------- prénom de la personne ---------- */
function construireNoms(){
  const boutons = n => `<button type="button" data-nom="${echappe(n)}" aria-pressed="false">${echappe(n)}</button>`;
  document.getElementById("f-noms").innerHTML   = MEMBRES.map(boutons).join("");
  document.getElementById("accueil-noms").innerHTML = MEMBRES.map(boutons).join("");
  document.getElementById("f-garde").innerHTML =
    '<option value=""></option>' + MEMBRES.map(n => `<option>${echappe(n)}</option>`).join("");
}
function definirMoi(nom){
  MOI = nom;
  if(stockageOK) localStorage.setItem(CLE_MOI, nom);
  document.getElementById("btn-moi").textContent = nom;
  document.getElementById("accueil").classList.remove("ouvert");
  toutAfficher();
}
document.getElementById("accueil-noms").addEventListener("click", e => {
  const b = e.target.closest("button"); if(b) definirMoi(b.dataset.nom);
});
document.getElementById("btn-moi").onclick = () => document.getElementById("accueil").classList.add("ouvert");

/* ---------- formulaire ---------- */
const feuille = document.getElementById("feuille"), voile = document.getElementById("voile");

function bascule(id, v){
  document.querySelectorAll("#" + id + " button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === v)));
}
function valeurBascule(id){
  const b = document.querySelector("#" + id + ' button[aria-pressed="true"]');
  return b ? b.dataset.val : "non";
}
const nomsChoisis = () => [...document.querySelectorAll('#f-noms button[aria-pressed="true"]')].map(b => b.dataset.nom);

function ouvrir(action){
  enCours = action || null;
  document.getElementById("feuille-titre").textContent = action ? "Modifier l'action" : "Nouvelle action";
  document.getElementById("btn-supprimer").style.display = action ? "block" : "none";
  const a = action || {date:new Date().toISOString().slice(0,10), encaisse:true,
                       participants: MOI ? [MOI] : [], nbParticipants: MOI ? 1 : ""};
  document.getElementById("f-date").value     = a.date || "";
  document.getElementById("f-nom").value      = a.nom || "";
  document.getElementById("f-montant").value  = a.montant ?? "";
  document.getElementById("f-duree").value    = a.duree ?? "";
  document.getElementById("f-nb").value       = a.nbParticipants ?? "";
  document.getElementById("f-nb").dataset.force = "";
  document.getElementById("f-client").value   = a.client || "";
  document.getElementById("f-tel").value      = a.contact || "";
  document.getElementById("f-lieu").value     = a.lieu || "";
  document.getElementById("f-notes").value    = a.notes || "";
  document.getElementById("f-paiement").value = a.paiement || "";
  document.getElementById("f-garde").value    = a.gardePar || "";
  bascule("f-groupe",   a.groupe ? "oui" : "non");
  bascule("f-encaisse", a.encaisse === false ? "non" : "oui");
  document.querySelectorAll("#f-noms button").forEach(b =>
    b.setAttribute("aria-pressed", String((a.participants || []).includes(b.dataset.nom))));
  rafraichirFormulaire();
  voile.classList.add("ouvert"); feuille.classList.add("ouverte");
  document.body.style.overflow = "hidden";
}
function fermer(){
  voile.classList.remove("ouvert"); feuille.classList.remove("ouverte");
  document.body.style.overflow = ""; enCours = null;
}
function rafraichirFormulaire(){
  const groupe = valeurBascule("f-groupe") === "oui";
  document.getElementById("f-noms").classList.toggle("gele", groupe);
  document.getElementById("label-noms").textContent =
    groupe ? "Toute l'équipe participe (rien à sélectionner)" : "Qui a participé";
  const brouillon = {
    montant: document.getElementById("f-montant").value,
    duree:   document.getElementById("f-duree").value,
    groupe,
    nbParticipants: document.getElementById("f-nb").value
  };
  document.getElementById("ap-personne").textContent = parPersonne(brouillon) ? euro2(parPersonne(brouillon)) : "—";
  const ph = parHeure(brouillon);
  document.getElementById("ap-heure").textContent = ph ? euro2(ph) : "—";
  const choisis = nomsChoisis().length, annonce = nb(document.getElementById("f-nb").value);
  const souci = !groupe && annonce > 0 && choisis > 0 && annonce !== choisis;
  const alerte = document.getElementById("f-alerte");
  alerte.classList.toggle("visible", souci);
  if(souci) alerte.textContent =
    `Tu as annoncé ${annonce} participant${annonce>1?"s":""} mais sélectionné ${choisis} prénom${choisis>1?"s":""}. Le partage se fait sur ${annonce}.`;
}

/* ---------- événements ---------- */
document.getElementById("bouton-ajouter").onclick = () => ouvrir(null);
document.getElementById("btn-annuler").onclick = fermer;
voile.onclick = fermer;
document.addEventListener("keydown", e => { if(e.key === "Escape") fermer(); });

document.getElementById("liste-actions").addEventListener("click", e => {
  const c = e.target.closest(".action");
  if(c) ouvrir(ACTIONS.find(a => a.id === c.dataset.id));
});
document.getElementById("liste-actions").addEventListener("keydown", e => {
  const c = e.target.closest(".action");
  if(c && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); ouvrir(ACTIONS.find(a => a.id === c.dataset.id)); }
});
document.querySelectorAll(".filtres button").forEach(b => b.onclick = () => {
  filtre = b.dataset.filtre;
  document.querySelectorAll(".filtres button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  afficherActions();
});
document.getElementById("f-groupe").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  bascule("f-groupe", b.dataset.val);
  if(b.dataset.val === "oui") document.getElementById("f-nb").value = MEMBRES.length;
  rafraichirFormulaire();
});
document.getElementById("f-encaisse").addEventListener("click", e => {
  const b = e.target.closest("button"); if(b) bascule("f-encaisse", b.dataset.val);
});
document.getElementById("f-noms").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
  const champ = document.getElementById("f-nb");
  if(!champ.dataset.force) champ.value = nomsChoisis().length || "";
  rafraichirFormulaire();
});
document.getElementById("f-nb").addEventListener("input", e => { e.target.dataset.force = "1"; rafraichirFormulaire(); });
["f-montant","f-duree"].forEach(id => document.getElementById(id).addEventListener("input", rafraichirFormulaire));
document.getElementById("recherche").addEventListener("input", afficherActions);

document.getElementById("btn-enregistrer").onclick = async () => {
  const groupe = valeurBascule("f-groupe") === "oui";
  const a = {
    id: enCours ? enCours.id : undefined,
    date:    document.getElementById("f-date").value,
    nom:     document.getElementById("f-nom").value.trim(),
    client:  document.getElementById("f-client").value.trim(),
    contact: document.getElementById("f-tel").value.trim(),
    lieu:    document.getElementById("f-lieu").value.trim(),
    montant: nb(document.getElementById("f-montant").value),
    duree:   nb(document.getElementById("f-duree").value),
    groupe,
    nbParticipants: groupe ? MEMBRES.length : nb(document.getElementById("f-nb").value),
    participants: groupe ? [] : nomsChoisis(),
    encaisse: valeurBascule("f-encaisse") === "oui",
    paiement: document.getElementById("f-paiement").value,
    gardePar: document.getElementById("f-garde").value,
    notes:    document.getElementById("f-notes").value.trim()
  };
  if(!a.nom){ signaler("Donne un nom à l'action avant d'enregistrer."); return; }
  const bouton = document.getElementById("btn-enregistrer");
  bouton.disabled = true; bouton.textContent = "Envoi…";
  try{
    if(enCours) await Base.modifier(a); else await Base.ajouter(a);
    ACTIONS = await Base.lire();
    fermer(); toutAfficher();
    signaler(EN_LIGNE ? "Action envoyée à toute l'équipe." : "Action enregistrée.");
  }catch(err){ signaler(err.message); }
  finally{ bouton.disabled = false; bouton.textContent = "Enregistrer"; }
};
document.getElementById("btn-supprimer").onclick = async () => {
  if(!enCours || !confirm("Supprimer « " + (enCours.nom || "cette action") + " » ?")) return;
  try{
    await Base.supprimer(enCours.id);
    ACTIONS = await Base.lire(); fermer(); toutAfficher();
  }catch(err){ signaler(err.message); }
};

function signaler(m){
  const a = document.getElementById("avis");
  a.textContent = m; a.classList.add("visible");
  clearTimeout(signaler.t);
  signaler.t = setTimeout(() => a.classList.remove("visible"), 4000);
}

/* ---------- mise à jour automatique ---------- */
async function recharger(silencieux){
  try{ ACTIONS = await Base.lire(); toutAfficher(); }
  catch(err){ if(!silencieux) signaler(err.message); }
}
if(EN_LIGNE){
  setInterval(() => { if(document.visibilityState === "visible") recharger(true); }, RAFRAICHIR_MS);
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible") recharger(true);
  });
}

/* ---------- démarrage ---------- */
(async function(){
  construireNoms();
  MOI = stockageOK ? localStorage.getItem(CLE_MOI) : null;
  if(MOI && MEMBRES.includes(MOI)) document.getElementById("btn-moi").textContent = MOI;
  else { MOI = null; document.getElementById("accueil").classList.add("ouvert"); }

  try{ ACTIONS = await Base.lire(); }catch(err){ signaler(err.message); ACTIONS = []; }
  toutAfficher();
  if(!EN_LIGNE) signaler("Sans base de données : tu ne vois que les actions saisies sur ce téléphone.");
})();
</script>
